[package]
name = "rustdesk-agent-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"
description = "MCP protocol and transport for RustDesk desktop agents"

[dependencies]
axum = "0.7"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[workspace]
