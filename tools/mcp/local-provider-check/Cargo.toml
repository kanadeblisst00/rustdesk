[package]
name = "rustdesk-local-provider-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
path = "lib.rs"

[dependencies]
base64 = "0.21"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "=1.3.4", features = ["v4"] }
image = { version = "0.24", default-features = false, features = ["png"] }
rustdesk-agent-mcp = { path = "../../../libs/agent_mcp", features = ["local"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.12", features = ["randr", "xtest", "xkb"] }
dbus = "0.9"

[build-dependencies]
cc = "=1.2.13"

[workspace]
