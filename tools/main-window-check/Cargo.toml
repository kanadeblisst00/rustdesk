[package]
name = "rustdesk-main-window-check"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "=1.0.98"
bytes = "=1.10.1"
futures = "=0.3.30"
libc = "=0.2.171"
log = "=0.4.22"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.118"
tokio = { version = "=1.44.2", features = ["full"] }
tokio-util = { version = "=0.7.15", features = ["codec"] }
parity-tokio-ipc = { git = "https://github.com/rustdesk-org/parity-tokio-ipc", rev = "d0ae39bffe5d5a3e8d82a1b6bcb1ca5a9b2f1c01" }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "synchapi", "handleapi", "errhandlingapi"] }

[features]
default = ["flutter"]
flutter = []

[[bin]]
name = "main-window-check"
path = "main.rs"

[workspace]
