name: Clean approved old-history Actions records
on:
  push:
    branches: [master]
    paths: [.github/workflows/cleanup-old-actions.yml]
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only approved records and verify absence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, urllib.request, urllib.error, time
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'kanadeblisst00/rustdesk', 'Unexpected repository'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          runs = {'40293426837': '61cccdd665af9b490c5d9d263299ef5df5f994ddca488be12dd4e9b5fcd44372', '39223668545': '61cccdd665af9b490c5d9d263299ef5df5f994ddca488be12dd4e9b5fcd44372', '38682707270': '6774cea14a46d1eac760a8deadad157f5bb44a5cce2a598323acf77ed3fa6c79', '38519009904': 'e169a2752bedfdc41156036a6c92f041c59c77d9ef30e1ab89712ef77d0d9bfa', '38499555178': 'b3b7ab8f1580354fe138d4e2d58f59af9ec8e9456e9bbcde0cfc39ef50b273a0', '38235965301': 'e0117636fbae4cb8f9d39977fe9e7fa22f4559520cf3c5f91a87362e038eb0a3', '37294369073': 'c13c97d1e09bfb020e0968f7d682e14179b6cc602660be91513c78ca62de6efe', '36403595851': 'c13c97d1e09bfb020e0968f7d682e14179b6cc602660be91513c78ca62de6efe', '35579058857': 'c13c97d1e09bfb020e0968f7d682e14179b6cc602660be91513c78ca62de6efe', '35502902098': 'c13c97d1e09bfb020e0968f7d682e14179b6cc602660be91513c78ca62de6efe', '35501247562': '9a56ca1e4e91f910352ef9e9d847e3a514c38aa5b53a0bc5b67b05771449f497', '35070623696': 'e2dd421fba382dc9eb5fd48ca116343dabbb5d1c0ef4d886f359c92fe2d091f2', '34823716756': '16f24a0eb7ca1475b3b1bbc5654f2972be6689e7d72883be77044c72e94017ba', '34681034929': '16f24a0eb7ca1475b3b1bbc5654f2972be6689e7d72883be77044c72e94017ba', '34446263148': 'e8ca09896c04918289b70e1ebc8d6787a501045412da999323b6bbebcfccc7cd', '34366966635': 'c1264071a3563f612b6529a6e014df776f46117f595eab4e15c81f888c2d39d1', '34199407460': '2de58d80de1f91fb921f7ee0555a7f33613f270c923ee0785e721c50fdb9e07b', '34197207919': 'f5f6479ca390563769bc637dd779f678b9f32084ffd86e7506b894322dc1b7e4', '34193309215': '9d460f169e4a0238840719a88d7acff2af26c93b023f6d446b2e421cd00aa4a2', '34189426453': '6f4ee1fce9ca67033dc428dc81f768471221af411a61551a4b53593a4ebcc160', '34098280086': '81300a2ad4de7fd7b820998304f7645d3cfd8762d8f514bab800d59ddcb3451e', '34081510627': '81300a2ad4de7fd7b820998304f7645d3cfd8762d8f514bab800d59ddcb3451e', '34081496739': '81300a2ad4de7fd7b820998304f7645d3cfd8762d8f514bab800d59ddcb3451e', '34031266530': '6b7d0f832a15ffb16c99934047c295fce5f7e61193da6ef40f6a625dfb88237d'}
          artifacts = {'11950977257': '6774cea14a46d1eac760a8deadad157f5bb44a5cce2a598323acf77ed3fa6c79', '11950256298': '6774cea14a46d1eac760a8deadad157f5bb44a5cce2a598323acf77ed3fa6c79', '11949619043': '6774cea14a46d1eac760a8deadad157f5bb44a5cce2a598323acf77ed3fa6c79', '11949422322': '6774cea14a46d1eac760a8deadad157f5bb44a5cce2a598323acf77ed3fa6c79', '11949233640': '6774cea14a46d1eac760a8deadad157f5bb44a5cce2a598323acf77ed3fa6c79', '11949203337': '6774cea14a46d1eac760a8deadad157f5bb44a5cce2a598323acf77ed3fa6c79', '11948887511': '6774cea14a46d1eac760a8deadad157f5bb44a5cce2a598323acf77ed3fa6c79', '11874816071': 'e169a2752bedfdc41156036a6c92f041c59c77d9ef30e1ab89712ef77d0d9bfa', '11874226779': 'e169a2752bedfdc41156036a6c92f041c59c77d9ef30e1ab89712ef77d0d9bfa', '11874061398': 'e169a2752bedfdc41156036a6c92f041c59c77d9ef30e1ab89712ef77d0d9bfa', '11873812719': 'e169a2752bedfdc41156036a6c92f041c59c77d9ef30e1ab89712ef77d0d9bfa', '11873579773': 'e169a2752bedfdc41156036a6c92f041c59c77d9ef30e1ab89712ef77d0d9bfa', '11873513138': 'e169a2752bedfdc41156036a6c92f041c59c77d9ef30e1ab89712ef77d0d9bfa', '11872748714': 'e169a2752bedfdc41156036a6c92f041c59c77d9ef30e1ab89712ef77d0d9bfa'}
          assert str(os.environ['GITHUB_RUN_ID']) not in runs, 'Refusing self-deletion'
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return 404, None
                  raise RuntimeError('GitHub request failed with HTTP ' + str(error.code)) from None
          for kind, targets in [('artifacts', artifacts), ('runs', runs)]:
              for identifier, expected in targets.items():
                  path = '/actions/' + kind + '/' + identifier
                  status, data = request(path)
                  if status == 404:
                      print(kind, identifier, 'already absent')
                      continue
                  assert status == 200, 'Unexpected read status'
                  if kind == 'runs':
                      assert data['repository']['full_name'] == repo, 'Repository mismatch'
                      assert data['status'] == 'completed', 'Run is still active'
                      head = data['head_sha']
                  else:
                      head = data['workflow_run']['head_sha']
                      assert str(data['workflow_run']['id']) in runs, 'Artifact run is outside the approved list'
                  assert hashlib.sha256(head.encode()).hexdigest() == expected, 'Approved revision mismatch'
                  status, _ = request(path, 'DELETE')
                  assert status == 204, 'Deletion did not succeed'
                  for attempt in range(6):
                      status, _ = request(path)
                      if status == 404:
                          break
                      time.sleep(2)
                  assert status == 404, 'Deletion not confirmed'
                  print(kind, identifier, 'deleted and verified')
          print('Approved old-history cleanup finished')
          PYTHON
