name: Dispatch one-time MCP Release build
on:
  push:
    branches: [master]
    paths: [.github/workflows/dispatch-mcp-release.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: one-time-mcp-release-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Enable existing workflow and dispatch a verified Release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request
          repo = os.environ['GH_REPO']
          if repo != 'kanadeblisst00/rustdesk':
              raise SystemExit('Unexpected repository')
          root = 'https://api.github.com/repos/' + repo
          workflow = 351087953
          expected = os.environ['EXPECTED_SHA']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(root + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  content = response.read()
                  return json.loads(content) if content else None
          head = api('/git/ref/heads/master')['object']['sha']
          if head != expected:
              raise SystemExit('Master changed; preserve state for review')
          info = api(f'/actions/workflows/{workflow}')
          if info['path'] != '.github/workflows/agent-mcp-build.yml':
              raise SystemExit('Unexpected build workflow')
          def runs():
              data = api(f'/actions/workflows/{workflow}/runs?event=workflow_dispatch&head_sha={expected}&per_page=100')
              return [r for r in data['workflow_runs'] if r['head_sha'] == expected]
          matches = runs()
          if matches:
              raise SystemExit('Matching run already exists; do not dispatch again: ' + str([r['id'] for r in matches]))
          api(f'/actions/workflows/{workflow}/enable', 'PUT')
          api(f'/actions/workflows/{workflow}/dispatches', 'POST', {'ref':'master', 'inputs':{'publish_release':True, 'isolated_macos':False, 'local_windows':False, 'local_unix':False}})
          print('Dispatch accepted. Never repeat POST while outcome is unknown.', flush=True)
          for attempt in range(20):
              matches = runs()
              if len(matches) == 1:
                  print(json.dumps({'run_id':matches[0]['id'], 'head_sha':expected, 'url':matches[0]['html_url'], 'publish_release':True}), flush=True)
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('Release build: ' + matches[0]['html_url'] + '\n')
                  break
              if len(matches) > 1:
                  raise SystemExit('Multiple matching runs; preserve state for review')
              time.sleep(3)
          else:
              raise SystemExit('Dispatch accepted but run not observed; query existing runs without repeating POST')
          PYCODE
