name: MCP desktop build

on:
  push:
    branches: [master]
    paths: [.github/workflows/agent-mcp-build.yml]
  workflow_dispatch:
    inputs:
      isolated_macos:
        description: Build macOS as the separate control-only RustDeskMCPTest app
        type: boolean
        default: false
      local_windows:
        description: Include opt-in local desktop control in the Windows build
        type: boolean
        default: false
      local_unix:
        description: Include opt-in local desktop control for macOS 14+ and Linux X11 (excludes isolated macOS)
        type: boolean
        default: false
      publish_release:
        description: Publish all platform packages to a new Release after every build succeeds
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_VERSION: "3.24.5"
  # Keep flutter-elinux's embedded Flutter aligned with the desktop SDK and its source patch.
  FLUTTER_ELINUX_VERSION: "3.24.5"
  FLUTTER_ELINUX_COMMIT_ID: "ac5e8387cdeadece7ed747d99da24d02adb354a6"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  CARGO_BUILD_JOBS: "3"

jobs:
  bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install bridge prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libgtk-3-dev llvm-dev ninja-build pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.75"
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: mcp-bridge
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.22.3"
      - name: Generate the desktop bridge
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          # Keep the generator SDK and dependency resolution aligned with .github/build-versions.yml.
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-bridge
          if-no-files-found: error
          retention-days: 7
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
      - name: Package MCP toolkit
        run: |
          mkdir rustdesk-mcp-toolkit
          cp tools/mcp/stdio.py rustdesk-mcp-toolkit/
          cp tools/mcp/build_matrix.py tools/mcp/build-matrix.example.json rustdesk-mcp-toolkit/
          cp tools/mcp/server-config.json rustdesk-mcp-toolkit/SERVER-CONFIG.json
          cp docs/agent-mcp.md rustdesk-mcp-toolkit/README.md
          cp docs/agent-mcp-build-jobs.md rustdesk-mcp-toolkit/
          cp docs/agent-mcp-local.md rustdesk-mcp-toolkit/
          python3 -c 'from pathlib import Path; p = Path("rustdesk-mcp-toolkit/agent-mcp-build-jobs.md"); p.write_text(p.read_text().replace("../tools/mcp/", ""), encoding="utf-8")'
          git rev-parse HEAD > rustdesk-mcp-toolkit/COMMIT.txt
          python3 -m zipfile -c rustdesk-mcp-toolkit.zip rustdesk-mcp-toolkit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: rustdesk-mcp-toolkit.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  android:
    name: MCP android-arm64
    needs: bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-bridge
          path: ./
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++-multilib gcc-multilib libclang-dev llvm-dev \
            nasm ninja-build openjdk-17-jdk-headless pkg-config
          python -m pip install cmake==4.3.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Patch Flutter dropdown menu
        run: |
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          git -C "$flutter_root" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup_ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.75"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: mcp-android-arm64
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/mcp-vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Embed and verify private server defaults
        run: |
          git -C libs/hbb_common apply --check "$GITHUB_WORKSPACE/.github/patches/agent-mcp-server.diff"
          git -C libs/hbb_common apply "$GITHUB_WORKSPACE/.github/patches/agent-mcp-server.diff"
          python tools/mcp/verify_server_config.py --source libs/hbb_common/src/config.rs
      - name: Install Android ARM64 native dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: ./flutter/build_android_deps.sh arm64-v8a
      - name: Build Android ARM64 application
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          ./flutter/ndk_arm64.sh
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so \
            flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            flutter/android/app/src/main/jniLibs/arm64-v8a/
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/' flutter/android/gradle.properties
          sed -i 's/signingConfigs.release/signingConfigs.debug/' flutter/android/app/build.gradle
          (cd flutter && flutter build apk --release --target-platform android-arm64 --split-per-abi)
      - name: Package Android ARM64 application
        run: |
          apk=flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          mkdir -p dist
          cp "$apk" dist/rustdesk-mcp-android-arm64.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/rustdesk-mcp-android-arm64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: MCP ${{ matrix.platform }}
    needs: bridge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            rust: "1.75"
            target: x86_64-pc-windows-msvc
            triplet: x64-windows-static
          - platform: linux-x64
            os: ubuntu-22.04
            rust: "1.75"
            target: x86_64-unknown-linux-gnu
            triplet: x64-linux
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            rust: "1.75"
            target: aarch64-unknown-linux-gnu
            triplet: arm64-linux
          - platform: macos-x64
            os: macos-15-intel
            rust: "1.81"
            target: x86_64-apple-darwin
            triplet: x64-osx
          - platform: macos-arm64
            os: macos-14
            rust: "1.81"
            target: aarch64-apple-darwin
            triplet: arm64-osx
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        env:
          # Preserve patch and submodule source line endings, including on Windows.
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcp-bridge
          path: ./
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install CMake for vcpkg
        run: python -m pip install cmake==4.3.0
      - name: Import persistent macOS signing identity
        if: runner.os == 'macOS' && !inputs.isolated_macos
        env:
          MCP_MACOS_CERTIFICATE_P12: ${{ secrets.MCP_MACOS_CERTIFICATE_P12 }}
          MCP_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MCP_MACOS_CERTIFICATE_PASSWORD }}
          MCP_MACOS_SIGN_IDENTITY: ${{ secrets.MCP_MACOS_SIGN_IDENTITY }}
        run: |
          python - <<'PY'
          import base64, os, pathlib, secrets, shlex, subprocess, sys
          sys.path.insert(0, 'tools/mcp')
          from package_desktop import macos_signing_options
          macos_signing_options()
          if not os.environ['MCP_MACOS_CERTIFICATE_P12'] or not os.environ['MCP_MACOS_CERTIFICATE_PASSWORD']:
              raise SystemExit('Configure the persistent MCP_MACOS_CERTIFICATE_P12 and MCP_MACOS_CERTIFICATE_PASSWORD secrets')
          os.umask(0o077)
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          p12 = root / 'rustdeskmcp-signing.p12'
          keychain = str(root / 'rustdeskmcp-signing.keychain-db')
          password = secrets.token_urlsafe(32)
          print('::add-mask::' + password, flush=True)
          def run(*args):
              result = subprocess.run(args, capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit('macOS signing setup failed: ' + args[0] + ' ' + args[1])
              return result.stdout
          try:
              p12.write_bytes(base64.b64decode(os.environ['MCP_MACOS_CERTIFICATE_P12'], validate=True))
              run('security', 'create-keychain', '-p', password, keychain)
              run('security', 'set-keychain-settings', '-lut', '21600', keychain)
              run('security', 'unlock-keychain', '-p', password, keychain)
              existing = shlex.split(run('security', 'list-keychains', '-d', 'user'))
              run('security', 'list-keychains', '-d', 'user', '-s', *existing, keychain)
              run('security', 'import', str(p12), '-k', keychain,
                  '-P', os.environ['MCP_MACOS_CERTIFICATE_PASSWORD'], '-T', '/usr/bin/codesign')
              run('security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', password, keychain)
              with open(os.environ['GITHUB_ENV'], 'a') as stream:
                  stream.write('MCP_MACOS_SIGN_IDENTITY=' + os.environ['MCP_MACOS_SIGN_IDENTITY'].strip() + '\n')
                  stream.write('MCP_MACOS_SIGN_KEYCHAIN=' + keychain + '\n')
          finally:
              p12.unlink(missing_ok=True)
          PY
      - name: Verify macOS signing continuity
        if: runner.os == 'macOS' && !inputs.isolated_macos
        run: python -m unittest discover -s tools/mcp -p test_macos_signing.py -v
      - name: Free disk space for Linux ARM64
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
      - name: Add swap space for Linux ARM64
        if: matrix.platform == 'linux-arm64'
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12
      - name: Embed and verify private server defaults
        run: |
          git -C libs/hbb_common apply --check "$GITHUB_WORKSPACE/.github/patches/agent-mcp-server.diff"
          git -C libs/hbb_common apply "$GITHUB_WORKSPACE/.github/patches/agent-mcp-server.diff"
          python tools/mcp/verify_server_config.py --source libs/hbb_common/src/config.rs
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev llvm-dev nasm ninja-build \
            pkg-config libayatana-appindicator3-dev libasound2-dev libgtk-3-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
            libssl-dev
      - name: Install Linux ARM64 Flutter prerequisites
        if: matrix.platform == 'linux-arm64'
        run: sudo apt-get install -y curl git unzip xz-utils
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          if ! command -v pkg-config; then brew install pkg-config; fi
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          if curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip -o "$RUNNER_TEMP/nasm.zip"; then
            unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP/mcp-nasm"
          else
            echo "::warning::NASM binary download failed; building the same version from the MacPorts source mirror."
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 https://distfiles.macports.org/nasm/nasm-2.16.03.tar.bz2 -o "$RUNNER_TEMP/nasm.tar.bz2"
            echo "bef3de159bcd61adf98bb7cc87ee9046e944644ad76b7633f18ab063edb29e57  $RUNNER_TEMP/nasm.tar.bz2" | shasum -a 256 -c -
            mkdir -p "$RUNNER_TEMP/mcp-nasm"
            tar -xjf "$RUNNER_TEMP/nasm.tar.bz2" -C "$RUNNER_TEMP/mcp-nasm"
            (
              cd "$RUNNER_TEMP/mcp-nasm/nasm-2.16.03"
              ./configure
              make -j3 nasm
            )
          fi
          "$RUNNER_TEMP/mcp-nasm/nasm-2.16.03/nasm" -v
          echo "$RUNNER_TEMP/mcp-nasm/nasm-2.16.03" >> "$GITHUB_PATH"
      - name: Install Windows LLVM
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "15.0.6"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: mcp-${{ matrix.platform }}
      - name: Install Windows Flutter
        if: runner.os == 'Windows'
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
      - name: Install Unix Flutter
        if: runner.os != 'Windows' && matrix.platform != 'linux-arm64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install Linux ARM64 Flutter toolchain
        if: matrix.platform == 'linux-arm64'
        run: |
          flutter_archive="$RUNNER_TEMP/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl --fail --location --retry 3 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            --output "$flutter_archive"
          tar -xf "$flutter_archive" -C "$RUNNER_TEMP"
          git clone --depth 1 --branch "$FLUTTER_ELINUX_VERSION" \
            https://github.com/sony/flutter-elinux.git "$RUNNER_TEMP/mcp-flutter-elinux"
          test "$(git -C "$RUNNER_TEMP/mcp-flutter-elinux" rev-parse HEAD)" = "$FLUTTER_ELINUX_COMMIT_ID"
          test "$(sed -n '2p' "$RUNNER_TEMP/mcp-flutter-elinux/bin/internal/flutter.version")" = "$FLUTTER_VERSION"
          "$RUNNER_TEMP/mcp-flutter-elinux/bin/flutter-elinux" doctor -v
          "$RUNNER_TEMP/mcp-flutter-elinux/bin/flutter-elinux" precache --linux
          mkdir -p "$RUNNER_TEMP/mcp-flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64"
          cp -R "$RUNNER_TEMP/flutter/bin/cache/artifacts/engine/linux-x64/shader_lib" \
            "$RUNNER_TEMP/mcp-flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64/"
          echo "$RUNNER_TEMP/mcp-flutter-elinux/bin" >> "$GITHUB_PATH"
      - name: Patch Flutter dropdown menu
        if: matrix.platform != 'linux-arm64'
        run: |
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          git -C "$flutter_root" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - name: Patch Linux ARM64 Flutter dropdown menu
        if: matrix.platform == 'linux-arm64'
        run: git -C "$RUNNER_TEMP/mcp-flutter-elinux/flutter" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - name: Use the upstream Windows Flutter engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)
          Invoke-WebRequest https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile "$env:RUNNER_TEMP/engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/engine.zip" "$env:RUNNER_TEMP/mcp-engine"
          Copy-Item "$env:RUNNER_TEMP/mcp-engine/*" "$flutterRoot/bin/cache/artifacts/engine/windows-x64-release/" -Recurse -Force
      - name: Apply upstream macOS build adjustments
        if: runner.os == 'macOS'
        run: |
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' "$flutter_root/packages/flutter/lib/src/scheduler/binding.dart"
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            sed -i -e 's/MACOSX_DEPLOYMENT_TARGET=10.14/MACOSX_DEPLOYMENT_TARGET=12.3/' build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '12.3'/" flutter/macos/Podfile
            sed -i -e 's/osx_minimum_system_version = "[0-9]*.[0-9]*"/osx_minimum_system_version = "12.3"/' Cargo.toml
            sed -i -e 's/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = 12.3;/' flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/mcp-vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install native dependencies
        if: matrix.platform != 'macos-x64'
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet "${{ matrix.triplet }}" --x-install-root="$VCPKG_ROOT/installed"
      - name: Install macOS x64 native dependencies with transient download retries
        if: matrix.platform == 'macos-x64'
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
        run: |
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/macos-x64-vcpkg-$attempt.log"
            if "$VCPKG_ROOT/vcpkg" install --triplet "${{ matrix.triplet }}" --x-install-root="$VCPKG_ROOT/installed" 2>&1 | tee "$log"; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'fatal: unable to access .*The requested URL returned error: (429|5[0-9]{2})' "$log"; then
              exit "$status"
            fi
            echo "::warning::Transient upstream download failure; retrying native dependencies (attempt $((attempt + 1))/3)."
            sleep "$((attempt * 15))"
          done
      - name: Preserve macOS x64 dependency failure logs
        if: failure() && matrix.platform == 'macos-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-x64-native-dependency-logs
          retention-days: 14
          path: ${{ runner.temp }}/macos-x64-vcpkg-*.log
      - name: Build MCP desktop application
        if: matrix.platform != 'linux-arm64'
        env:
          ISOLATED_MACOS: ${{ inputs.isolated_macos }}
          LOCAL_WINDOWS: ${{ inputs.local_windows }}
          LOCAL_UNIX: ${{ inputs.local_unix }}
        run: |
          args=(--flutter --mcp --hwcodec)
          if [ "$RUNNER_OS" = "Windows" ]; then
            args+=(--portable)
            if [ "$LOCAL_WINDOWS" = "true" ]; then
              args+=(--mcp-local)
            fi
          else
            args+=(--unix-file-copy-paste)
            if [ "$LOCAL_UNIX" = "true" ] && ! { [ "$RUNNER_OS" = "macOS" ] && [ "$ISOLATED_MACOS" = "true" ]; }; then
              args+=(--mcp-local)
            fi
          fi
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            args+=(--screencapturekit)
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ "$ISOLATED_MACOS" = "true" ]; then
            args+=(--mcp-isolated)
          fi
          python build.py "${args[@]}" --print-features
          python build.py "${args[@]}"
      - name: Build MCP desktop application for Linux ARM64
        if: matrix.platform == 'linux-arm64'
        env:
          DEB_ARCH: arm64
          LOCAL_UNIX: ${{ inputs.local_unix }}
        run: |
          args=(--flutter --mcp --hwcodec --unix-file-copy-paste)
          if [ "$LOCAL_UNIX" = "true" ]; then
            args+=(--mcp-local)
          fi
          features="$(python build.py "${args[@]}" --print-features)"
          sed -i 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/' Cargo.toml
          grep -Fq 'crate-type = ["cdylib"]' Cargo.toml
          export CARGO_INCREMENTAL=0
          cargo build --locked --lib --release --jobs "$CARGO_BUILD_JOBS" --features "$features"
          test -s target/release/liblibrustdesk.so || {
            echo "::error::Missing or empty Cargo library: target/release/liblibrustdesk.so" >&2
            exit 1
          }
          sed -i 's/flutter build linux --release/flutter-elinux build linux --verbose/' build.py
          sed -i 's/x64\/release/arm64\/release/g' build.py
          grep -Fq "flutter-elinux build linux --verbose" build.py
          grep -Fq "build/linux/arm64/release/bundle/" build.py
          python build.py "${args[@]}" --skip-cargo
      - name: Verify native command worker from the built application
        if: runner.os != 'macOS' || !inputs.isolated_macos
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            worker=flutter/build/windows/x64/runner/Release/rustdeskmcp.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            worker=flutter/build/macos/Build/Products/Release/RustDeskMCP.app/Contents/MacOS/service
          elif [ "$MATRIX_PLATFORM" = "linux-arm64" ]; then
            worker=flutter/build/linux/arm64/release/bundle/rustdeskmcp
          else
            worker=flutter/build/linux/x64/release/bundle/rustdeskmcp
          fi
          test -s "$worker"
          export RUSTDESK_MCP_TEST_EXECUTABLE="$GITHUB_WORKSPACE/$worker"
          python -m unittest discover -s tools/mcp -p test_process_worker.py -v
      - name: Package Windows self-extracting executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem -Path . -Filter "rustdesk-*-install.exe" -File)
          if ($portable.Count -ne 1) {
            throw "Expected one RustDesk self-extracting executable, found $($portable.Count)"
          }
          New-Item -ItemType Directory -Force dist
          Move-Item $portable[0].FullName "dist/rustdesk-mcp-windows-x64-install.exe"
      - name: Package Linux bundle and Debian package
        if: matrix.platform == 'linux-x64'
        run: |
          test -s flutter/build/linux/x64/release/bundle/rustdeskmcp
          test -s flutter/build/linux/x64/release/bundle/lib/librustdesk.so
          mkdir -p dist
          tar -czf dist/rustdesk-mcp-linux-x64.tar.gz -C flutter/build/linux/x64/release bundle
          cp rustdesk-mcp-*.deb dist/
      - name: Package Linux ARM64 bundle and Debian package
        if: matrix.platform == 'linux-arm64'
        run: |
          test -s flutter/build/linux/arm64/release/bundle/rustdeskmcp
          test -s flutter/build/linux/arm64/release/bundle/lib/librustdesk.so
          mkdir -p dist
          tar -czf dist/rustdesk-mcp-linux-arm64.tar.gz -C flutter/build/linux/arm64/release bundle
          cp rustdesk-mcp-*.deb dist/
      - name: Package macOS application with symlinks preserved
        if: runner.os == 'macOS'
        env:
          ISOLATED_MACOS: ${{ inputs.isolated_macos }}
        run: |
          app=flutter/build/macos/Build/Products/Release/RustDeskMCP.app
          binary=RustDeskMCP
          if [ "$ISOLATED_MACOS" = "true" ]; then
            app=flutter/build/macos/Build/Products/Release/RustDeskMCPTest.app
            binary=RustDesk
            "$app/Contents/MacOS/RustDesk" --mcp-isolation-info > "$RUNNER_TEMP/mcp-native-info.json"
            python tools/mcp/verify_server_config.py --native-info "$RUNNER_TEMP/mcp-native-info.json"
          fi
          test -s "$app/Contents/MacOS/$binary"
          test -s "$app/Contents/MacOS/service"
          test -s "$app/Contents/Frameworks/liblibrustdesk.dylib"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/rustdesk-mcp-${{ matrix.platform }}.app.zip"
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS' && !inputs.isolated_macos
        run: |
          keychain="$RUNNER_TEMP/rustdeskmcp-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          path: dist/rustdesk-mcp-windows-x64-install.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os != 'Windows'
        id: upload_unix
        continue-on-error: ${{ matrix.platform == 'macos-x64' }}
        with:
          name: rustdesk-mcp-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Retry macOS x64 artifact upload
        if: ${{ !cancelled() && matrix.platform == 'macos-x64' && steps.upload_unix.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-mcp-${{ matrix.platform }}
          path: dist/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    if: github.event_name == 'push' || inputs.publish_release
    needs: [bridge, android, desktop]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_OPTIONS: ${{ github.event_name == 'push' && '{"isolated_macos":false,"local_windows":false,"local_unix":false,"publish_release":true}' || toJSON(inputs) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rustdesk-mcp-@(windows-*|linux-*|macos-*|android-*)
          path: incoming
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdesk-mcp-toolkit.zip
          path: incoming/toolkit
          skip-decompress: true
          digest-mismatch: error
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify and prepare release assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, zipfile
          incoming = pathlib.Path('incoming')
          release = pathlib.Path('release')
          release.mkdir()
          names = [
              'rustdesk-mcp-windows-x64-install.exe',
              'rustdesk-mcp-linux-x64.tar.gz',
              'rustdesk-mcp-linux-arm64.tar.gz',
              'rustdesk-mcp-macos-x64.app.zip',
              'rustdesk-mcp-macos-arm64.app.zip',
              'rustdesk-mcp-android-arm64.apk',
              'rustdesk-mcp-toolkit.zip',
          ]
          for name in names:
              matches = [p for p in incoming.rglob(name) if p.is_file()]
              if len(matches) != 1 or not matches[0].stat().st_size:
                  raise SystemExit(f'Expected one non-empty asset: {name}; found {matches}')
              shutil.copyfile(matches[0], release / name)
          for platform, arch in [('linux-x64', 'amd64'), ('linux-arm64', 'arm64')]:
              matches = list((incoming / f'rustdesk-mcp-{platform}').glob('*.deb'))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one Debian package for {platform}: {matches}')
              actual = subprocess.check_output(['dpkg-deb', '-f', str(matches[0]), 'Architecture'], text=True).strip()
              if actual != arch:
                  raise SystemExit(f'Incorrect Debian architecture for {platform}: {actual}')
              shutil.copyfile(matches[0], release / f'{matches[0].stem}-{arch}.deb')
          for path in release.iterdir():
              if not path.stat().st_size:
                  raise SystemExit(f'Empty release asset: {path}')
              if path.suffix in ('.zip', '.apk'):
                  with zipfile.ZipFile(path) as archive:
                      if archive.testzip() is not None:
                          raise SystemExit(f'Corrupt ZIP asset: {path}')
                      if path.name == 'rustdesk-mcp-toolkit.zip':
                          commit = archive.read('rustdesk-mcp-toolkit/COMMIT.txt').decode().strip()
                          if commit != os.environ['GITHUB_SHA']:
                              raise SystemExit(f'Toolkit commit mismatch: {commit}')
          files = sorted(release.iterdir())
          sums = ''.join(f'{hashlib.file_digest(p.open("rb"), "sha256").hexdigest()}  {p.name}\n' for p in files)
          (release / 'SHA256SUMS.txt').write_text(sums)
          run_url = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          notes = f'RustDesk MCP 多平台构建。\n\n源码提交：`{os.environ["GITHUB_SHA"]}`\n\n[编译与原生 worker 验证记录]({run_url})：全部构建成功。\n\n构建选项：\n```json\n{json.dumps(json.loads(os.environ["BUILD_OPTIONS"]), ensure_ascii=False, indent=2)}\n```\n\n'
          notes += '下载附件：\n\n' + ''.join(f'- `{p.name}`\n' for p in files)
          notes += '\n`SHA256SUMS.txt` 包含各附件的 SHA-256。\n'
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY
      - name: Create draft, verify uploaded assets, and publish
        shell: bash
        run: |
          set -euo pipefail
          tag="mcp-$(TZ=Asia/Shanghai date +%Y-%m-%d)-${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release/* --draft --target "$GITHUB_SHA" \
            --title "RustDesk MCP $(TZ=Asia/Shanghai date +%Y-%m-%d) #${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md
          release_id="$(gh release view "$tag" --json databaseId --jq .databaseId)"
          gh api "repos/$GH_REPO/releases/$release_id" > uploaded-assets.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          expected = {p.name: p for p in pathlib.Path('release').iterdir()}
          assets = json.loads(pathlib.Path('uploaded-assets.json').read_text())['assets']
          if len(assets) != len(expected) or {a['name'] for a in assets} != set(expected):
              raise SystemExit('Uploaded release asset set does not match local files')
          for asset in assets:
              path = expected[asset['name']]
              digest = 'sha256:' + hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
              if asset['size'] != path.stat().st_size or asset.get('digest') != digest:
                  raise SystemExit(f'Uploaded asset size/digest mismatch: {path.name}')
          PY
          gh release edit "$tag" --draft=false --latest
          gh release view "$tag" --json url,isDraft,tagName > release-result.json
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path('release-result.json').read_text())
          if result['isDraft']:
              raise SystemExit('Release is still a draft')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Published [{result["tagName"]}]({result["url"]}) with verified SHA-256 assets.\n')
          PY
      - name: Preserve release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification
          retention-days: 14
          path: |
            release/SHA256SUMS.txt
            release-notes.md
            uploaded-assets.json
            release-result.json
